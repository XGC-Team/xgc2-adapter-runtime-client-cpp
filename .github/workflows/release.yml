name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected immutable source commit
        required: true
        type: string
      prepare_action:
        required: false
        default: release
        type: choice
        options: [release, compatibility-verify]
      apt_overlay_url:
        description: Optional release-train staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the release-train dependency set
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
        run: |
          set -euo pipefail
          version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          [[ "${version}" == "${EXPECTED_VERSION}" ]]
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]]
          case "${{ inputs.prepare_action }}" in
            release|compatibility-verify) ;;
            *) exit 1 ;;
          esac
          if [[ -n "${DEPENDENCY_SET_DIGEST}" &&
                ! "${DEPENDENCY_SET_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          if [[ -n "${APT_OVERLAY_URL}" && -z "${DEPENDENCY_SET_DIGEST}" ]]; then
            echo "APT overlay requires a dependency-set digest" >&2
            exit 1
          fi
          ./.xgc2/scripts/check_package_compliance.sh
          source .xgc2/dependencies/xgc2-protobuf.env
          [[ "${XGC2_PROTOBUF_STANDALONE_SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]
  cpp-quality:
    needs: release-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling xgc2-protobuf-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./.xgc2/scripts/fetch_protobuf_deb.sh focal proto-debs
      - name: Focal source tests
        run: |
          set -euo pipefail
          docker run --rm \
            -e BUILD_UID="$(id -u)" -e BUILD_GID="$(id -g)" -e HOME=/tmp \
            -e XGC2_APT_OVERLAY_URL="${XGC2_APT_OVERLAY_URL:-}" \
            -e XGC2_DEPENDENCY_SET_DIGEST="${XGC2_DEPENDENCY_SET_DIGEST:-}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${GITHUB_WORKSPACE}/proto-debs:/proto-debs:ro" \
            -w /work \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.8@sha256:fce2d76fddf4f6439bf0a188249b731650febdc163befc360bed186b269d252a \
            bash -lc '
              set -euo pipefail
              dpkg -i /proto-debs/xgc2-protobuf-dev_*.deb
              suite="${PACKAGE_DISTRIBUTION:-focal}"
              ./.xgc2/scripts/configure_xgc2_apt.sh "$suite"
              apt-get install -y --no-install-recommends libxgc2-xrpc-grpc-dev
              if [[ "$suite" == focal ]]; then export CC=clang-10 CXX=clang++-10; fi
              for pkg in build-essential clang-format cmake cppcheck \
                libgrpc++-dev libgtest-dev libprotobuf-dev libre2-dev \
                pkg-config protobuf-compiler protobuf-compiler-grpc
              do
                dpkg -s "${pkg}" >/dev/null
              done
              setpriv --reuid "$BUILD_UID" --regid "$BUILD_GID" --clear-groups ./.xgc2/scripts/check_cpp_quality.sh
            '
  deb-build-and-smoke:
    needs: release-guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: amd64, runner: ubuntu-latest, platform: linux/amd64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.8@sha256:fce2d76fddf4f6439bf0a188249b731650febdc163befc360bed186b269d252a", distribution: focal}
          - {architecture: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.8@sha256:fce2d76fddf4f6439bf0a188249b731650febdc163befc360bed186b269d252a", distribution: focal}
          - {architecture: amd64, runner: ubuntu-latest, platform: linux/amd64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-full-humble:1.0.3@sha256:784dc2690d63b62ad2ec3cfdac12bf63c5931247c7ae816de8f73d336e0dc9a5", distribution: jammy}
          - {architecture: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-full-humble:1.0.3@sha256:784dc2690d63b62ad2ec3cfdac12bf63c5931247c7ae816de8f73d336e0dc9a5", distribution: jammy}
          - {architecture: amd64, runner: ubuntu-latest, platform: linux/amd64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-full-jazzy:1.0.3@sha256:aeb658acc5e40f5aad5caeb61c6aa5511a23b2111a28e88e7453defa02a32104", distribution: noble}
          - {architecture: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-full-jazzy:1.0.3@sha256:aeb658acc5e40f5aad5caeb61c6aa5511a23b2111a28e88e7453defa02a32104", distribution: noble}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling xgc2-protobuf-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./.xgc2/scripts/fetch_protobuf_deb.sh \
            "${{ matrix.distribution }}" proto-debs
      - name: Build release-train artifact
        run: |
          set -euo pipefail
          install -d .ci/build-manifests
          docker run --rm \
            -e BUILD_UID="$(id -u)" -e BUILD_GID="$(id -g)" -e HOME=/tmp \
            -e XGC2_APT_OVERLAY_URL="${XGC2_APT_OVERLAY_URL:-}" \
            -e XGC2_DEPENDENCY_SET_DIGEST="${XGC2_DEPENDENCY_SET_DIGEST:-}" --platform "${{ matrix.platform }}" \
            -e PACKAGE_DISTRIBUTION="${{ matrix.distribution }}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${GITHUB_WORKSPACE}/proto-debs:/proto-debs:ro" \
            -w /work \
            "${{ matrix.image }}" bash -lc '
              set -euo pipefail
              dpkg -i /proto-debs/xgc2-protobuf-dev_*.deb
              suite="${PACKAGE_DISTRIBUTION:-focal}"
              ./.xgc2/scripts/configure_xgc2_apt.sh "$suite"
              apt-get install -y --no-install-recommends libxgc2-xrpc-grpc-dev
              if [[ "$suite" == focal ]]; then export CC=clang-10 CXX=clang++-10; fi
              for pkg in build-essential cmake dpkg-dev fakeroot file \
                libgrpc++-dev libprotobuf-dev libre2-dev pkg-config \
                protobuf-compiler protobuf-compiler-grpc
              do
                dpkg -s "${pkg}" >/dev/null
              done
              setpriv --reuid "$BUILD_UID" --regid "$BUILD_GID" --clear-groups ./.xgc2/scripts/build_deb.sh
              dpkg -i \
                ./debs/libxgc2-adapter-runtime-client3_*.deb \
                ./debs/libxgc2-adapter-runtime-client-dev_*.deb
              setpriv --reuid "$BUILD_UID" --regid "$BUILD_GID" --clear-groups ./.xgc2/scripts/smoke_test_installed.sh
            '
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product libxgc2-adapter-runtime-client-dev \
            --product-version "${{ inputs.expected_version }}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-workflow "${GITHUB_WORKFLOW}" \
            --ci-workflow-ref "${GITHUB_WORKFLOW_REF}"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.prepare_action == 'release' }}
        with:
          name: adapter-runtime-client-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true


